<!DOCTYPE html>
<html lang="zh-CN" class="{% if request.endpoint == 'chapter_detail' %}is-study-page{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{% block title %}Math · 数学题库{% endblock %}</title>
  <script>
    (function () {
      var storageKey = "theme-preference:v1";
      var preference = "system";
      try {
        var stored = window.localStorage.getItem(storageKey);
        if (stored === "light" || stored === "dark" || stored === "system") {
          preference = stored;
        }
      } catch (error) {}

      var prefersDark = false;
      try {
        prefersDark = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)").matches : false;
      } catch (error) {}

      document.documentElement.dataset.themeMode = preference;
      document.documentElement.dataset.theme = preference === "system" ? (prefersDark ? "dark" : "light") : preference;
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/katex/katex.min.css', v=asset_version) }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v=asset_version) }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-glyph" aria-hidden="true">∑</span>
        <span class="brand-text">
          <strong>Math</strong>
          <small>专注刷题</small>
        </span>
      </a>

      <nav class="nav-pill-track" data-sliding-nav aria-label="主导航">
        <span class="nav-pill-indicator" data-nav-indicator aria-hidden="true"></span>
        {% for item in subjects %}
        <a
          href="{{ url_for('subject_detail', subject_id=item.id) }}"
          class="nav-pill-item {% if subject is defined and subject.id == item.id %}is-active{% endif %}"
          data-nav-item
        >
          {{ item.name }}
        </a>
        {% endfor %}
        <a
          href="{{ url_for('favorites') }}"
          class="nav-pill-item nav-pill-fav {% if request.endpoint == 'favorites' %}is-active{% endif %}"
          data-nav-item
        >
          <span>收藏</span>
          <span class="nav-fav-badge" data-favorites-badge hidden>0</span>
        </a>
      </nav>

      <div class="topbar-actions">
        <a
          class="icon-btn topbar-github-btn"
          href="https://github.com/Mufumoca/math"
          target="_blank"
          rel="noopener noreferrer"
          title="GitHub 开源仓库 (Mufumoca/math)"
          aria-label="前往 GitHub 开源仓库"
        >
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"></path>
          </svg>
        </a>
        <div class="theme-segmented" role="radiogroup" aria-label="外观模式" data-theme-segmented>
          <span class="theme-segmented-thumb" data-theme-thumb aria-hidden="true"></span>
          <button type="button" class="theme-seg-btn" data-theme-option="light" title="浅色模式" aria-label="浅色模式">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <circle cx="10" cy="10" r="3.6"></circle>
              <path stroke-linecap="round" d="M10 2.5v1.8M10 15.7v1.8M17.5 10h-1.8M4.3 10H2.5M15.3 4.7l-1.3 1.3M6 14l-1.3 1.3M15.3 15.3L14 14M6 6L4.7 4.7"></path>
            </svg>
          </button>
          <button type="button" class="theme-seg-btn" data-theme-option="system" title="跟随系统" aria-label="跟随系统">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <rect x="2.8" y="3.5" width="14.4" height="10" rx="2"></rect>
              <path stroke-linecap="round" d="M7 16.5h6M10 13.5v3"></path>
            </svg>
          </button>
          <button type="button" class="theme-seg-btn" data-theme-option="dark" title="深色模式" aria-label="深色模式">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.4 12.4A6.2 6.2 0 0 1 7.6 4.6a6.3 6.3 0 1 0 7.8 7.8Z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="app-shell">
    {% block content %}{% endblock %}
  </div>

  <script src="{{ url_for('static', filename='vendor/katex/katex.min.js', v=asset_version) }}"></script>
  <script src="{{ url_for('static', filename='js/app.js', v=asset_version) }}"></script>
</body>
</html>
